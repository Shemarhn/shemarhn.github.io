<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive preview</title><style>body{margin:24px;background:#f3f7f5;color:#102e38;font:16px/1.5 system-ui,sans-serif}h1{font-size:24px;margin:0 0 8px}a{color:#086d70}label{font-weight:600}select{font:inherit;padding:6px;margin:8px 14px}iframe{display:block;width:390px;height:560px;border:1px solid #bccdca;background:white;margin-top:14px}#status{font-size:14px} .frame-wrap{overflow:auto;padding-bottom:12px}</style></head>
<body><h1>Portfolio responsive preview</h1><p>Quality-check view of the published Harborlight entry. <a href="../#harborlight">Open the portfolio</a></p><label for="size">Preview width</label><select id="size"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option></select><span id="status" role="status" aria-live="polite">Loading preview…</span><div class="frame-wrap"><iframe id="preview" title="Published portfolio layout preview" src="../#harborlight"></iframe></div>
<script>
const frame=document.getElementById('preview');
const size=document.getElementById('size');
function report(){const win=frame.contentWindow;const doc=frame.contentDocument;if(!doc||!doc.querySelector('#harborlight'))return;document.getElementById('status').textContent='Rendered width: '+win.innerWidth+' px · horizontal overflow: '+(doc.documentElement.scrollWidth>win.innerWidth?'yes':'none');}
size.addEventListener('change',()=>{frame.style.width=size.value+'px';requestAnimationFrame(()=>requestAnimationFrame(report));});
frame.addEventListener('load',report);
</script></body></html>
