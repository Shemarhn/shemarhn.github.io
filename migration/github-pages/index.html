<!doctype html>
<html lang="en">
  <head>

    <h1>Shemar Marks has moved.</h1>
    <p>
      Visit <a id="destination" href="https://shemarmarks.com/">shemarmarks.com</a> for cloud

      <a href="https://shemarmarks.com/contact/">Contact</a>

    <script>
      const paths = {
        services: '/services/',
        work: '/work/',
        northstar: '/work/northstar/',
        cedarfield: '/work/cedarfield/',
        harborlight: '/work/harborlight/',
        care: '/services/maintenance/',
        about: '/about/',
        contact: '/contact/',
      };
      const key = location.hash.slice(1);
      const target = 'https://shemarmarks.com' + (paths[key] || '/') + location.search;
      document.getElementById('destination').href = target;
      location.replace(target);
