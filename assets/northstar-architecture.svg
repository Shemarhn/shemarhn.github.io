<text x="55" y="65" class="title">Protected workload: access, recovery and detection</text><text x="55" y="100" class="sub">Topology encoded in Terraform, bootstrap and operational scripts</text>
<rect x="290" y="160" width="1060" height="510" rx="20" fill="#e7eef6" stroke="#a6b7c9" stroke-dasharray="8 5"/><text x="315" y="194" class="tag">AWS ACCOUNT / SINGLE-SERVER IMPLEMENTATION</text><rect x="45" y="265" width="225" height="130" rx="14" fill="white" stroke="#c9d5e3"/><rect x="45" y="265" width="6" height="130" rx="3" fill="#155e75"/><text x="65" y="291" class="tag">ACCESS</text><text x="65" y="318" class="head">Staff workstation</text><text x="65" y="348" class="line">AWS identity</text><text x="65" y="373" class="line">Encrypted session</text><rect x="45" y="510" width="225" height="135" rx="14" fill="white" stroke="#c9d5e3"/><rect x="45" y="510" width="6" height="135" rx="3" fill="#155e75"/><text x="65" y="536" class="tag">CONTROL PLANE</text><text x="65" y="563" class="head">Terraform</text><text x="65" y="593" class="line">Versioned resource model</text><text x="65" y="618" class="line">Private local state</text><rect x="335" y="265" width="225" height="130" rx="14" fill="white" stroke="#c9d5e3"/><rect x="335" y="265" width="6" height="130" rx="3" fill="#155e75"/><text x="355" y="291" class="tag">REMOTE ACCESS</text><text x="355" y="318" class="head">Session Manager</text><text x="355" y="348" class="line">SSM agent channel</text><text x="355" y="373" class="line">No inbound ports</text><rect x="610" y="225" width="325" height="210" rx="14" fill="white" stroke="#c9d5e3"/><rect x="610" y="225" width="6" height="210" rx="3" fill="#155e75"/><text x="630" y="251" class="tag">COMPUTE + DATA</text><text x="630" y="278" class="head">EC2 workload</text><text x="630" y="308" class="line">Dedicated public subnet</text><text x="630" y="333" class="line">Loopback app / systemd</text><text x="630" y="358" class="line">Encrypted gp3 / SQLite</text><text x="630" y="383" class="line">IMDSv2 / scoped role</text><rect x="1020" y="245" width="290" height="175" rx="14" fill="white" stroke="#c9d5e3"/><rect x="1020" y="245" width="6" height="175" rx="3" fill="#155e75"/><text x="1040" y="271" class="tag">RECOVERY DATA</text><text x="1040" y="298" class="head">Private S3</text><text x="1040" y="328" class="line">Consistent snapshots</text><text x="1040" y="353" class="line">Versioning / SSE-S3</text><text x="1040" y="378" class="line">TLS-only / lifecycle</text><rect x="610" y="520" width="325" height="125" rx="14" fill="white" stroke="#c9d5e3"/><rect x="610" y="520" width="6" height="125" rx="3" fill="#155e75"/><text x="630" y="546" class="tag">DETECTION</text><text x="630" y="573" class="head">CloudWatch</text><text x="630" y="603" class="line">App / disk / backup age</text><text x="630" y="628" class="line">EC2 status + retained logs</text><rect x="1020" y="520" width="290" height="125" rx="14" fill="white" stroke="#c9d5e3"/><rect x="1020" y="520" width="6" height="125" rx="3" fill="#155e75"/><text x="1040" y="546" class="tag">RESPONSE</text><text x="1040" y="573" class="head">SNS email</text><text x="1040" y="603" class="line">State-change notifications</text><text x="1040" y="628" class="line">Confirmed subscription</text><path d="M270,325 H335" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><path d="M560,325 H610" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><path d="M935,285 H1020" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="226" class="label">Hourly snapshot</text><path d="M1020,380 H935" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="445" class="label">Release / restore</text><path d="M770,435 V520" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="480" class="label">5-minute telemetry</text><path d="M935,580 H1020" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)"/><path d="M270,570 H550 V445 H630" fill="none" stroke="#50647a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="350" y="553" class="label">Provisioning</text><text x="315" y="476" class="line">Outbound HTTPS via IGW</text><text x="315" y="501" class="line">AWS APIs / OS updates</text><text x="55" y="725" class="sub">Logical service/data flows. Migration and recovery executed; see evidence for control-validation scope.</text></svg>