name: Validate and deploy production
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_ANALYTICS_TOKEN: ${{ vars.PUBLIC_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: github.event_name != 'pull_request'
        run: node scripts/prepare-production.mjs
      - run: pnpm build
      - run: pnpm test:site
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist
      - name: Check deployment configuration and current main revision
        id: release
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Production deployment token is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account ID is missing'; exit 1; }
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded main revision'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.current == 'true'
        run: pnpm exec wrangler deploy
      - if: steps.release.outputs.current == 'true'
        name: Verify production URLs and deployed revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          AUDIT_REPORT: production-audit.json
        run: node scripts/verify-production.mjs
      - if: always() && steps.release.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-audit
          path: production-audit.json
